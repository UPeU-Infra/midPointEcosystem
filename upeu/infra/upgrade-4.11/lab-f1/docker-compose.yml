# Clon de MidPoint PROD para el ENSAYO F1 en el laboratorio (192.168.15.150).
# Runbook: docs/upgrade-4.11/F1-ensayo-lab.md
#
# Es el compose de PROD (upeu/infra/docker-compose.yml) con estas diferencias, y
# NINGUNA otra:
#   - proyecto `mp411` (volumenes mp411_midpoint_home / mp411_midpoint_data, red
#     mp411_net), contenedores mp411_server / mp411_data: no choca con el MidPoint
#     del lab (:8081) ni con nada mas;
#   - red con SUBRED FIJA 172.31.41.0/24: es la que filtra aislamiento-red.sh (solo
#     sale a Oracle LAMB 192.168.13.9:1521, lectura);
#   - puerto publicado ${LAB_PORT:-8085};
#   - conectores y certs desde ${LAB_DIR}/{connectors,certs} (sacados del tar del home);
#   - data_init NEUTRALIZADO SIEMPRE: la BD se crea con pg_restore, nunca con run-sql --create;
#   - memoria configurable (LAB_MP_MEM_* y LAB_PG_*) por si el lab no tiene
#     los 15 GB que usa PROD. Si se rebaja, los tiempos medidos no son los de PROD.
# Los nombres de servicio, volumen y red coinciden con PROD para que los overrides
# ../docker-compose.upgrade-window.yml y ../docker-compose.4.11.yml se usen tal cual.
#
#   cd $LAB_DIR; W=<clon>/upeu/infra/upgrade-4.11
#   docker compose -f $W/lab-f1/docker-compose.yml --env-file $LAB_DIR/.env [-f $W/docker-compose.upgrade-window.yml] ...
name: mp411

services:
  midpoint_data:
    image: postgres:16-bullseye
    container_name: mp411_data
    command: >
      postgres
      -c shared_buffers=${LAB_PG_SHARED_BUFFERS:-1536MB}
      -c effective_cache_size=${LAB_PG_CACHE:-3GB}
      -c work_mem=48MB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c max_connections=50
      -c random_page_cost=1.1
      -c max_parallel_workers_per_gather=6
      -c max_worker_processes=14
    environment:
      - POSTGRES_PASSWORD=${MP_DB_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_INITDB_ARGS=--lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
    networks:
      - net
    volumes:
      - midpoint_data:/var/lib/postgresql/data
    mem_limit: ${LAB_PG_MEM_LIMIT:-5g}
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d midpoint"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  data_init:
    image: evolveum/midpoint:${MP_VER}-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "echo 'data_init NEUTRALIZADO en el clon F1 (la BD sale de pg_restore)'; exit 0"
    networks:
      - net

  midpoint_server:
    image: evolveum/midpoint:${MP_VER}-ubuntu
    container_name: mp411_server
    hostname: mp411-container
    depends_on:
      data_init:
        condition: service_completed_successfully
      midpoint_data:
        condition: service_healthy
    command: ["/opt/midpoint/bin/midpoint.sh", "container"]
    ports:
      - "${LAB_PORT:-8085}:8080"
    environment:
      - MP_SET_midpoint_repository_jdbcUsername=${POSTGRES_USER}
      - MP_SET_midpoint_repository_jdbcPassword=${MP_DB_PASSWORD}
      - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
      - MP_SET_midpoint_repository_database=postgresql
      - MP_SET_midpoint_administrator_initialPassword=${MP_ADMIN_PASSWORD}
      - MP_UNSET_midpoint_repository_hibernateHbm2ddl=1
      - MP_NO_ENV_COMPAT=1
      - TZ=America/Lima
      - MP_MEM_INIT=${LAB_MP_MEM_INIT:-5120m}
      - MP_MEM_MAX=${LAB_MP_MEM_MAX:-9216m}
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=32m -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC -XX:ParallelGCThreads=8 -XX:ConcGCThreads=4 -XX:G1ReservePercent=20 -XX:InitiatingHeapOccupancyPercent=35 -Djavax.net.ssl.trustStore=/opt/midpoint/certs/truststore.jceks -Djavax.net.ssl.trustStorePassword=${MP_TRUSTSTORE_PASSWORD}
    networks:
      - net
    volumes:
      - midpoint_home:/opt/midpoint/var
      - ${MP_CONNECTORS_DIR}:/opt/midpoint/var/icf-connectors:ro
      - ${LAB_DIR}/certs:/opt/midpoint/certs:ro
    mem_limit: ${LAB_MP_MEM_LIMIT:-10g}

networks:
  net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.41.0/24

volumes:
  midpoint_data:
  midpoint_home:
