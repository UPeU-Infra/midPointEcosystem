# Reproduccion minima del fallo de F3 (11-nov-2026): con midPoint 4.11.0 el
# ejecutor Groovy de ConnId 1.7.0.0-M0 lanza
#   NoClassDefFoundError: org/jenkinsci/plugins/scriptsecurity/sandbox/Whitelist
# Ver README.md de esta carpeta y docs/upgrade-4.11/F3-RESULTADO-2026-11-11.md.
#
# midPoint VACIO (sin datos de PROD) + ScriptedSQL 2.2.10 contra el propio Postgres
# del proyecto. Nada sale del lab. Un proyecto por version:
#   MP_VER=4.10.5 PORT=8098 docker compose -p mprepro4105 --env-file .env up -d
#   MP_VER=4.11.0 PORT=8099 docker compose -p mprepro4110 --env-file .env up -d
services:
  midpoint_data:
    image: postgres:16-bullseye
    environment:
      - POSTGRES_PASSWORD=${MP_DB_PASSWORD}
      - POSTGRES_USER=midpoint
      - POSTGRES_DB=midpoint
    volumes:
      - midpoint_data:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midpoint -d midpoint"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Igual que el data_init de PROD (upeu/infra/docker-compose.yml)
  data_init:
    image: evolveum/midpoint:${MP_VER}-alpine
    command: >
      bash -c "
      cd /opt/midpoint ;
      bin/midpoint.sh init-native ;
      bin/ninja.sh -B info >/dev/null 2>/tmp/ninja.log ;
      grep -q \"ERROR\" /tmp/ninja.log && (
      bin/ninja.sh run-sql --create --mode REPOSITORY  ;
      bin/ninja.sh run-sql --create --mode AUDIT
      ) ||
      echo Repository init is not needed ;
      "
    depends_on:
      midpoint_data:
        condition: service_healthy
    environment:
      - MP_SET_midpoint_repository_jdbcUsername=midpoint
      - MP_SET_midpoint_repository_jdbcPassword=${MP_DB_PASSWORD}
      - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
      - MP_SET_midpoint_repository_database=postgresql
      - MP_INIT_CFG=/opt/midpoint/var
    volumes:
      - midpoint_home:/opt/midpoint/var

  midpoint_server:
    image: evolveum/midpoint:${MP_VER}-ubuntu
    depends_on:
      data_init:
        condition: service_completed_successfully
      midpoint_data:
        condition: service_healthy
    command: ["/opt/midpoint/bin/midpoint.sh", "container"]
    ports:
      - "${PORT}:8080"
    environment:
      - MP_SET_midpoint_repository_jdbcUsername=midpoint
      - MP_SET_midpoint_repository_jdbcPassword=${MP_DB_PASSWORD}
      - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
      - MP_SET_midpoint_repository_database=postgresql
      - MP_SET_midpoint_administrator_initialPassword=${MP_ADMIN_PASSWORD}
      - MP_UNSET_midpoint_repository_hibernateHbm2ddl=1
      - MP_NO_ENV_COMPAT=1
      - TZ=America/Lima
      - MP_MEM_INIT=1024m
      - MP_MEM_MAX=2048m
    volumes:
      - midpoint_home:/opt/midpoint/var
      # El mismo bundle que PROD (sha256 comprobado por repro.sh preparar)
      - ./connectors:/opt/midpoint/var/icf-connectors:ro
    mem_limit: 3g

volumes:
  midpoint_data:
  midpoint_home:
