# Override PERMANENTE a partir de 4.11.0 (ventana F3 en adelante).
#
#   cd /opt/midpoint; W=~/midPointEcosystem/upeu/infra/upgrade-4.11
#   docker compose -f docker-compose.yml -f $W/docker-compose.4.11.yml up -d
#   (durante la ventana, ademas: -f $W/docker-compose.upgrade-window.yml, antes de este)
#
# Desde 4.11.0 las imagenes corren como el usuario no-root `midpoint`, UID 1000
# (release notes 4.11.0, "Container images ... run as non-root user midpoint
# with UID 1000"). Se deja escrito para que no dependa del valor por defecto de
# la imagen. PRECONDICION: el volumen midpoint_midpoint_home ya es 1000:1000
# (chown en la ventana F3, paso 6). Sin el chown, keystore.jceks (hoy root 0600)
# no se puede leer y midPoint no descifra nada.
#
# Los bind de solo lectura (/opt/midpoint/connectors y /opt/midpoint/certs) son
# legibles por el UID 1000 tal como estan (ficheros 0644).
#
# ✅ 12-nov-2026: F3 hecha; el `user: "1000:1000"` ya esta integrado en el
# docker-compose.yml base (upeu/infra/docker-compose.yml). Este fichero se
# conserva solo porque lo citan los runbooks de F1/F3; aplicarlo encima del base
# no cambia nada.

services:
  data_init:
    user: "1000:1000"
  midpoint_server:
    user: "1000:1000"
# El servicio `ninja` (override de ventana) no se fija aqui: usa el usuario por
# defecto de la imagen (root en 4.10.x, 1000 en 4.11). Para ejecutar la ninja
# de 4.11 ANTES del chown (pre-upgrade-check), anadir `--user 0` al `run`.
